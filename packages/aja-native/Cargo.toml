[package]
name = "aja"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AJA native PyO3 engine: offline tokenizer, Arrow baton IPC, trajectory analysis"
publish = false

[lib]
name = "aja_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
arrow = "58.0.0"
arrow-ipc = "58.0.0"
tiktoken-rs = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rustc-hash = "2"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
